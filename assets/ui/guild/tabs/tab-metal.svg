<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 108" fill="none" preserveAspectRatio="none">
<defs>
 <linearGradient id="metal" x1="0" y1="8" x2="0" y2="97" gradientUnits="userSpaceOnUse"><stop stop-color="#0a1d31"/><stop offset=".22" stop-color="#1d3651"/><stop offset=".51" stop-color="#233b53"/><stop offset=".75" stop-color="#172b42"/><stop offset=".92" stop-color="#0a1d31"/><stop offset="1" stop-color="#061326"/></linearGradient>
 <linearGradient id="top" x1="55" y1="0" x2="435" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#bacfe0"/><stop offset=".22" stop-color="#637f97"/><stop offset=".60" stop-color="#486983"/><stop offset=".92" stop-color="#8fafca"/><stop offset="1" stop-color="#bbd5ee"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="500" y2="100" gradientUnits="userSpaceOnUse"><stop stop-color="#a9c6df"/><stop offset=".35" stop-color="#294b69"/><stop offset=".75" stop-color="#527c9d"/><stop offset="1" stop-color="#b1cfe4"/></linearGradient>
 <linearGradient id="light" x1="130" y1="23" x2="330" y2="102" gradientUnits="userSpaceOnUse">
