name: Engine v2 checks
on:
  push:
    branches: [engine-v2]
    paths: ['engine-v2/**', '.github/workflows/engine-v2.yml']
  pull_request:
    paths: ['engine-v2/**', '.github/workflows/engine-v2.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node tools/audit-storage.mjs
