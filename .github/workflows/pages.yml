name: DBO Idle — publikacja gry
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz pliki gry
        uses: actions/checkout@v4
      - name: Skonfiguruj Pages
        uses: actions/configure-pages@v5
      - name: Przygotuj wersje CSS i JS
        run: python3 scripts/version_assets.py
      - name: Wyslij pliki strony
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Opublikuj strone
        id: deployment
        uses: actions/deploy-pages@v4
