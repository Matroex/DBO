<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBOidle — Kreator postaci</title><link rel="stylesheet" href="css/creator.css"></head><body><div class="background" aria-hidden="true"></div><main class="creator"><header><span>DBOidle / KREATOR POSTACI</span><strong>Wybierz rasę wojownika</strong><small id="limit"></small></header><section class="races" id="races" aria-label="Wybór rasy"></section><form id="create"><label for="name">Nazwa postaci</label><input id="name" maxlength="20" minlength="3" autocomplete="off" placeholder="Wpisz nazwę postaci" required><label for="child">Kod dziecka</label><input id="child" maxlength="32" placeholder="Wpisz kod dziecka (opcjonalnie)" autocomplete="off"><p id="error" role="alert"></p><div class="actions"><button class="primary" type="submit">Rozpocznij</button><button type="button" id="cancel">Anuluj</button></div></form><p class="note">Wersja testowa — postacie są zapisywane lokalnie w przeglądarce.</p></main><script src="js/creator.js"></script></body></html>
