services:
  engine:
    profiles: [staging]
    build: .
    environment:
      DBO_BIND_HOST: 0.0.0.0
      PGHOST: postgres
      PGDATABASE: dboidle
      PGUSER: dboidle
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local .env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dboidle
      POSTGRES_USER: dboidle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dboidle_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dboidle -d dboidle"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dboidle_pg:
