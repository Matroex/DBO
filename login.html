<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBOidle — Logowanie</title><link rel="stylesheet" href="css/auth.css"><link rel="stylesheet" href="css/realm.css"></head><body><div class="scenery" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div><div class="particles" aria-hidden="true"></div><main class="login-layout"><div class="brand" aria-label="DBOidle"><div class="orb"><span class="stars">★ ★ ★ ★</span><strong>DBO<span>idle</span></strong></div></div><section class="auth-panel"><div class="tabs"><button id="tabLogin" class="selected" type="button">Logowanie</button><button id="tabRegister" type="button">Rejestracja</button></div><form id="authForm" autocomplete="on"><label for="username">Login</label><input id="username" name="username" minlength="3" maxlength="24" required autocomplete="username" placeholder="Wpisz login..."><label for="password">Hasło</label><div class="password-row"><input id="password" name="password" type="password" minlength="6" required autocomplete="current-password" placeholder="Wpisz hasło..."><button id="showPassword" type="button" aria-label="Pokaż hasło">◉</button></div><div id="confirmGroup" hidden><label for="confirm">Powtórz hasło</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Powtórz hasło..."></div><label class="remember" id="rememberRow"><input id="remember" type="checkbox"> Zapamiętaj mnie</label><p id="message" role="status" aria-live="polite"></p><div class="actions"><button id="submitButton" class="primary" type="submit">Zaloguj</button><button id="otherButton" class="secondary" type="button">Zarejestruj</button></div></form><p class="demo-note">Wersja lokalna do testów — bez kont serwerowych.</p></section></main><script src="js/auth.js?v=17fix1"></script></body></html>
